
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CampusEats Catalogue</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CampusEats Catalogue</h1>
    <p class="sub">The menu — served by a REST API (Node + Express)</p>

    <div id="message"></div>

    <h3>Restaurant Login</h3>

    <form id="loginForm">
        <input
            id="email"
            type="email"
            placeholder="Restaurant email"
            value="mealhub@campus.edu"
            required
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>
    </form>

    <div id="list">Loading...</div>

    <form id="addForm">
        <h3>Add a dish</h3>

        <input id="name" placeholder="Dish name" required>

        <input
            id="price"
            type="number"
            placeholder="Price (rupees)"
            min="0"
            required
        >

        <button type="submit">Add dish</button>
    </form>

    <script>

        const message = document.getElementById('message');

        // Store JWT token
        let token = localStorage.getItem('RESTO_TOKEN');

        // Show message
        function showMessage(text) {
            message.textContent = text;
        }

        // 1. LOGIN
        document.getElementById('loginForm').addEventListener('submit', async (e) => {

            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Login failed');
                }

                token = data.token;

                localStorage.setItem('RESTO_TOKEN', token);

                showMessage('Restaurant login successful!');

                document.getElementById('password').value = '';

            } catch (error) {
                showMessage(error.message);
            }

        });


        // 2. READ MENU
        async function load() {

            try {
                const res = await fetch('/items');

                if (!res.ok) {
                    throw new Error('Unable to load menu');
                }

                const items = await res.json();

                document.getElementById('list').innerHTML =
                    items.map(i =>
                        `<div class="dish">
                            <span class="name"></span>
                            <span class="price"></span>
                        </div>`
                    ).join('');

                const dishes = document.querySelectorAll('.dish');

                items.forEach((item, index) => {
                    dishes[index].querySelector('.name').textContent = item.name;
                    dishes[index].querySelector('.price').textContent = '₹' + item.price;
                });

            } catch (error) {
                showMessage(error.message);
            }

        }


        // 3. ADD DISH
        document.getElementById('addForm').addEventListener('submit', async (e) => {

            e.preventDefault();

            if (!token) {
                showMessage('Please login as restaurant first!');
                return;
            }

            const name = document.getElementById('name').value;
            const price = Number(document.getElementById('price').value);

            try {

                const res = await fetch('/items', {
                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },

                    body: JSON.stringify({ name, price })
                });

                const data = await res.json();

                if (!res.ok) {
                    if (res.status === 401) {
                        token = null;
                        localStorage.removeItem('RESTO_TOKEN');
                    }

                    throw new Error(data.error || 'Failed to add dish');
                }

                showMessage('Dish added successfully!');

                e.target.reset();

                // Refresh menu automatically
                await load();

            } catch (error) {
                showMessage(error.message);
            }

        });


        // 4. LOAD MENU WHEN PAGE OPENS
        load();

    </script>

</body>
</html>
